apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-api
  namespace: mcp-poc
  labels:
    app: tasks-api
    role: production-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tasks-api
  template:
    metadata:
      labels:
        app: tasks-api
        role: production-system
    spec:
      containers:
        - name: tasks-api
          image: localhost/mcp-poc/tasks-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
