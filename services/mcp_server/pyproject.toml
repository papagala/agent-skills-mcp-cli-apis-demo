[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server exposing intent-grouped tools backed by the Tasks API."
requires-python = ">=3.12"
dependencies = [
    "mcp==1.27.0",
    "httpx==0.28.1",
    "uvicorn[standard]==0.32.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
